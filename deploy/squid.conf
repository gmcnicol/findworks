acl model_provider dstdomain .api.openai.com
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow model_provider
http_access deny all
http_port 3128
access_log none
cache_log /dev/null
cache_store_log none
cache deny all
via off
forwarded_for delete
