name: findworks-${FINDWORKS_ENVIRONMENT:?Set local, staging, or production}

services:
  ingress:
    image: ${INGRESS_IMAGE:?Set a digest-pinned Caddy image}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "443:443"
    configs:
      - source: caddy
        target: /etc/caddy/Caddyfile
    secrets:
      - source: tls_certificate
        target: tls.crt
      - source: tls_private_key
        target: tls.key
    networks: [public, ingress_private]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${FINDWORKS_IMAGE:?Set the immutable application image digest}
    command: ["web"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment: &application_environment
      FINDWORKS_ENVIRONMENT: ${FINDWORKS_ENVIRONMENT}
      FINDWORKS_DATABASE_ID: ${FINDWORKS_DATABASE_ID:?Set an environment-unique database ID}
      FINDWORKS_PROVIDER_ACCOUNT_ID: ${FINDWORKS_PROVIDER_ACCOUNT_ID:?Set an environment-unique provider ID}
      DATABASE_URL: ${DATABASE_URL:?Set managed PostgreSQL URL with sslmode=verify-full}
      DATABASE_USERNAME: ${WEB_DATABASE_USERNAME:?Set web database role}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set canonical HTTPS origin}
      PILOT_ORGANISATION_ID: ${PILOT_ORGANISATION_ID:?Set pilot Organisation ID}
      INVESTIGATOR_EMAIL: ${INVESTIGATOR_EMAIL:?Set Investigator email}
      INVITATION_SENDER: ${INVITATION_SENDER:?Set verified sender}
      INVITATION_TOKEN_KEY_ID: ${INVITATION_TOKEN_KEY_ID:?Set invitation key ID}
      INTERVIEW_CONTACT: ${INTERVIEW_CONTACT:?Set contact route}
      SECRETS_DIRECTORY: /run/secrets
      MANAGEMENT_SERVER_PORT: "8082"
      STRUCTURED_LOG_FORMAT: ecs
      BREAK_GLASS_KEY_ID: ${BREAK_GLASS_KEY_ID:?Set break-glass key ID}
      RECOVERY_GATE_REQUIRED: "true"
      BACKUP_REQUIRED: "true"
      RECOVERY_APPLICATION_IMAGE: ${FINDWORKS_IMAGE:?Set immutable application image digest}
    secrets:
      - source: web_database_password
        target: spring.datasource.password
      - source: investigator_password
        target: findworks.pilot.investigator-password
      - source: invitation_active_secret
        target: findworks.invitation.active-secret
      - source: invitation_previous_secret
        target: findworks.invitation.previous-secret
      - source: break_glass_key
        target: findworks.operations.break-glass-key
    expose: ["8080", "8082"]
    networks: [ingress_private, database_egress, monitor_private]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    image: ${FINDWORKS_IMAGE:?Set the immutable application image digest}
    command: ["worker"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *application_environment
      DATABASE_USERNAME: ${WORKER_DATABASE_USERNAME:?Set worker database role}
      SERVER_PORT: "8081"
      INTERVIEW_RUNTIME_ENABLED: "true"
      OCI_EXECUTABLE: podman-remote
      CONTAINER_HOST: unix:///run/podman/podman.sock
      PI_RUNTIME_IMAGE: ${PI_RUNTIME_IMAGE:?Set immutable Pi image digest}
      PI_RUNTIME_NETWORK: ${PI_RUNTIME_NETWORK:?Set private Pi network}
      PI_RUNTIME_EGRESS_PROXY: ${PI_RUNTIME_EGRESS_PROXY:?Set narrow HTTPS proxy URL}
      RUNTIME_CHECKPOINT_KEY_ID: ${RUNTIME_CHECKPOINT_KEY_ID:?Set checkpoint key ID}
    secrets:
      - source: worker_database_password
        target: spring.datasource.password
      - source: invitation_active_secret
        target: findworks.invitation.active-secret
      - source: invitation_previous_secret
        target: findworks.invitation.previous-secret
      - source: model_provider_credential
        target: findworks.runtime.provider-credential
      - source: runtime_checkpoint_key
        target: findworks.runtime.checkpoint-key
    volumes:
      - type: bind
        source: ${ROOTLESS_OCI_SOCKET:?Set dedicated worker OCI socket}
        target: /run/podman/podman.sock
    expose: ["8081", "8082"]
    networks: [worker_private, database_egress, monitor_private]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
    stop_grace_period: 2m
    restart: unless-stopped

  migrate:
    profiles: ["migrate"]
    image: ${FINDWORKS_IMAGE:?Set the immutable application image digest}
    command: ["migrate"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *application_environment
      DATABASE_USERNAME: ${MIGRATOR_DATABASE_USERNAME:?Set schema-owner database role}
    secrets:
      - source: migrator_database_password
        target: spring.datasource.password
    networks: [database_egress]

  support:
    profiles: ["support"]
    image: ${FINDWORKS_IMAGE:?Set the immutable application image digest}
    command: ["support"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *application_environment
      DATABASE_USERNAME: ${SUPPORT_DATABASE_USERNAME:?Set support database role}
      SUPPORT_OPERATOR_ID: ${SUPPORT_OPERATOR_ID:?Set authorised operator ID}
      FINDWORKS_OPERATIONS_COMMAND: ${SUPPORT_COMMAND:-}
      FINDWORKS_OPERATIONS_KIND: ${SUPPORT_KIND:-}
      FINDWORKS_OPERATIONS_ID: ${SUPPORT_ID:-}
      FINDWORKS_OPERATIONS_REASON_CODE: ${SUPPORT_REASON_CODE:-}
      FINDWORKS_OPERATIONS_UNTIL: ${SUPPORT_UNTIL:-}
    secrets:
      - source: support_database_password
        target: spring.datasource.password
      - source: break_glass_key
        target: findworks.operations.break-glass-key
      - source: break_glass_reason
        target: findworks.operations.reason
    networks: [database_egress]

  recovery:
    profiles: ["recovery"]
    image: ${FINDWORKS_IMAGE:?Set immutable application image digest}
    command: ["recovery"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *application_environment
      DATABASE_URL: ${RECOVERY_DATABASE_URL:?Set isolated restore database URL}
      DATABASE_USERNAME: ${RECOVERY_DATABASE_USERNAME:?Set short-lived recovery role}
      RECOVERY_OPERATOR_ID: ${RECOVERY_OPERATOR_ID:?Set authorised recovery operator ID}
      RECOVERY_BUNDLE_KEY_ID: ${RECOVERY_BUNDLE_KEY_ID:?Set recovery bundle key ID}
      FINDWORKS_RECOVERY_COMMAND: ${RECOVERY_COMMAND_NAME:-}
      FINDWORKS_RECOVERY_OUTPUT: ${RECOVERY_OUTPUT:-}
      FINDWORKS_RECOVERY_BUNDLE: ${RECOVERY_BUNDLE:-}
      FINDWORKS_RECOVERY_MANIFEST: ${RECOVERY_MANIFEST:-}
      FINDWORKS_RECOVERY_SOURCE_KIND: ${RECOVERY_SOURCE_KIND:-synthetic}
      FINDWORKS_RECOVERY_BACKUP_ID: ${RECOVERY_BACKUP_ID:-}
      FINDWORKS_RECOVERY_CANDIDATE_RESTORE_ID: ${RECOVERY_CANDIDATE_RESTORE_ID:-}
      FINDWORKS_RECOVERY_LEDGER_RESTORE_ID: ${RECOVERY_LEDGER_RESTORE_ID:-}
      FINDWORKS_RECOVERY_SOURCE_TIMELINE: ${RECOVERY_SOURCE_TIMELINE:-}
      FINDWORKS_RECOVERY_INCIDENT_AUTHORISED_AT: ${RECOVERY_INCIDENT_AUTHORISED_AT:-}
      FINDWORKS_RECOVERY_REQUESTED_RESTORE_AT: ${RECOVERY_REQUESTED_RESTORE_AT:-}
      FINDWORKS_RECOVERY_ACHIEVED_RESTORE_AT: ${RECOVERY_ACHIEVED_RESTORE_AT:-}
      FINDWORKS_RECOVERY_ENCRYPTED_AT_REST: ${RECOVERY_ENCRYPTED_AT_REST:-}
      FINDWORKS_RECOVERY_ENCRYPTED_IN_TRANSIT: ${RECOVERY_ENCRYPTED_IN_TRANSIT:-}
      FINDWORKS_RECOVERY_RECOVERY_POINT_GAP_SECONDS: ${RECOVERY_POINT_GAP_SECONDS:-}
      FINDWORKS_RECOVERY_SNAPSHOT_INTERVAL_HOURS: ${RECOVERY_SNAPSHOT_INTERVAL_HOURS:-}
      FINDWORKS_RECOVERY_BACKUP_RETENTION_DAYS: ${RECOVERY_BACKUP_RETENTION_DAYS:-}
    secrets:
      - source: recovery_database_password
        target: spring.datasource.password
      - source: recovery_bundle_key
        target: findworks.recovery.bundle-key
    volumes:
      - type: bind
        source: ${RECOVERY_WORK_DIRECTORY:?Set private recovery work directory}
        target: /run/recovery
    networks: [database_egress]

  acceptance:
    profiles: ["acceptance"]
    image: ${FINDWORKS_IMAGE:?Set immutable application image digest}
    command: ["acceptance"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *application_environment
      DATABASE_USERNAME: ${SUPPORT_DATABASE_USERNAME:?Set support database role}
      SUPPORT_OPERATOR_ID: ${SUPPORT_OPERATOR_ID:?Set authorised operator ID}
      FINDWORKS_ACCEPTANCE_COMMAND: ${M0_ACCEPTANCE_COMMAND_NAME:-}
      FINDWORKS_ACCEPTANCE_INPUT: /run/acceptance/input.json
      M0_RELEASE_DIGEST: ${M0_RELEASE_DIGEST:?Set frozen release digest}
      M0_GIT_COMMIT: ${M0_GIT_COMMIT:?Set frozen Git commit}
      M0_SKILL_DIGEST: ${M0_SKILL_DIGEST:?Set frozen skill digest}
      M0_EXTENSION_DIGEST: ${M0_EXTENSION_DIGEST:?Set frozen extension digest}
      M0_TRACEABILITY_DIGEST: ${M0_TRACEABILITY_DIGEST:?Set traceability matrix digest}
      PI_RUNTIME_IMAGE: ${PI_RUNTIME_IMAGE:?Set immutable Pi image digest}
      PI_PROVIDER: ${PI_PROVIDER:?Set frozen provider alias}
      PI_MODEL: ${PI_MODEL:?Set frozen model alias}
    secrets:
      - source: support_database_password
        target: spring.datasource.password
    volumes:
      - type: bind
        source: ${M0_ACCEPTANCE_INPUT_FILE:?Set protected content-free acceptance input}
        target: /run/acceptance/input.json
        read_only: true
    networks: [database_egress]

  egress:
    image: ${EGRESS_PROXY_IMAGE:?Set a reviewed digest-pinned HTTPS allow-list proxy image}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    configs:
      - source: egress_proxy
        target: /etc/findworks/egress-proxy.conf
    secrets:
      - source: egress_tls_certificate
        target: tls.crt
      - source: egress_tls_private_key
        target: tls.key
    networks: [pi_private, provider_egress]
    restart: unless-stopped

configs:
  caddy:
    file: ./Caddyfile
  egress_proxy:
    file: ${EGRESS_PROXY_CONFIG:?Set reviewed proxy configuration}

secrets:
  tls_certificate:
    file: ${TLS_CERTIFICATE_FILE:?Set TLS certificate file}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_FILE:?Set TLS private key file}
  egress_tls_certificate:
    file: ${EGRESS_TLS_CERTIFICATE_FILE:?Set egress TLS certificate file}
  egress_tls_private_key:
    file: ${EGRESS_TLS_PRIVATE_KEY_FILE:?Set egress TLS private key file}
  web_database_password:
    file: ${WEB_DATABASE_PASSWORD_FILE:?Set web database password file}
  worker_database_password:
    file: ${WORKER_DATABASE_PASSWORD_FILE:?Set worker database password file}
  migrator_database_password:
    file: ${MIGRATOR_DATABASE_PASSWORD_FILE:?Set migrator password file}
  investigator_password:
    file: ${INVESTIGATOR_PASSWORD_FILE:?Set Investigator password file}
  invitation_active_secret:
    file: ${INVITATION_ACTIVE_SECRET_FILE:?Set invitation secret file}
  invitation_previous_secret:
    file: ${INVITATION_PREVIOUS_SECRET_FILE:?Set previous invitation secret file}
  model_provider_credential:
    file: ${MODEL_PROVIDER_CREDENTIAL_FILE:?Set model credential file}
  runtime_checkpoint_key:
    file: ${RUNTIME_CHECKPOINT_KEY_FILE:?Set checkpoint key file}
  support_database_password:
    file: ${SUPPORT_DATABASE_PASSWORD_FILE:?Set support database password file}
  break_glass_key:
    file: ${BREAK_GLASS_KEY_FILE:?Set break-glass key file}
  break_glass_reason:
    file: ${BREAK_GLASS_REASON_FILE:?Set protected break-glass reason file}
  recovery_database_password:
    file: ${RECOVERY_DATABASE_PASSWORD_FILE:?Set short-lived recovery password file}
  recovery_bundle_key:
    file: ${RECOVERY_BUNDLE_KEY_FILE:?Set recovery bundle signing key file}

networks:
  public: {}
  ingress_private: {internal: true}
  worker_private: {internal: true}
  monitor_private: {internal: true}
  pi_private:
    name: ${PI_RUNTIME_NETWORK:?Set private Pi network}
    internal: true
  database_egress: {}
  provider_egress: {}
