services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: findworks
      POSTGRES_USER: findworks
      POSTGRES_PASSWORD: findworks
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findworks -d findworks"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - findworks-postgres:/var/lib/postgresql/data
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/findworks
      SPRING_DATASOURCE_USERNAME: findworks
      SPRING_DATASOURCE_PASSWORD: findworks
      FINDWORKS_BASE_URL: http://127.0.0.1:${FINDWORKS_E2E_PORT:-8080}
      FINDWORKS_TEST_SUPPORT: "true"
      FINDWORKS_PROCESS_MODE: all
      FINDWORKS_COOKIE_SECURE: "false"
      FINDWORKS_OPERATOR_TOKEN: test-operator-token
    ports: ["127.0.0.1:${FINDWORKS_E2E_PORT:-8080}:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 45
volumes:
  findworks-postgres:
