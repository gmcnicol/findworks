services:
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/findworks
      DATABASE_USERNAME: findworks
      DATABASE_PASSWORD: findworks
      INVESTIGATOR_EMAIL: ${INVESTIGATOR_EMAIL:-investigator@findworks.local}
      INVESTIGATOR_PASSWORD: ${INVESTIGATOR_PASSWORD:-findworks}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set canonical public HTTPS origin}
      INVITATION_SENDER: ${INVITATION_SENDER:?Set verified invitation sender}
      INVITATION_TOKEN_KEY_ID: ${INVITATION_TOKEN_KEY_ID:?Set invitation token key ID}
      INVITATION_TOKEN_SECRET: ${INVITATION_TOKEN_SECRET:?Set invitation token secret}
      INVITATION_PREVIOUS_TOKEN_KEY_ID: ${INVITATION_PREVIOUS_TOKEN_KEY_ID:-}
      INVITATION_PREVIOUS_TOKEN_SECRET: ${INVITATION_PREVIOUS_TOKEN_SECRET:-}
      INTERVIEW_CONTACT: ${INTERVIEW_CONTACT:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: findworks
      POSTGRES_USER: findworks
      POSTGRES_PASSWORD: findworks
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findworks -d findworks"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - findworks-postgres:/var/lib/postgresql/data

volumes:
  findworks-postgres:
