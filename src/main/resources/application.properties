spring.application.name=findworks
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/findworks}
spring.datasource.username=${DATABASE_USERNAME:findworks}
spring.datasource.password=${DATABASE_PASSWORD:findworks}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.flyway.validate-migration-naming=true
spring.threads.virtual.enabled=true

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=FindWorks

server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never

findworks.pilot.organisation-id=${PILOT_ORGANISATION_ID:10000000-0000-0000-0000-000000000001}
findworks.pilot.investigator-email=${INVESTIGATOR_EMAIL:investigator@findworks.local}
findworks.pilot.investigator-password=${INVESTIGATOR_PASSWORD:findworks}
findworks.pi.executable=${PI_EXECUTABLE:pi}
findworks.pi.provider=${PI_PROVIDER:openai-codex}
findworks.pi.model=${PI_MODEL:gpt-5.6-luna}
findworks.pi.session-directory=${PI_SESSION_DIRECTORY:${java.io.tmpdir}/findworks-pi-sessions}
findworks.pi.timeout=${PI_TIMEOUT:PT90S}
