spring.application.name=findworks
spring.config.import=optional:configtree:${SECRETS_DIRECTORY:/run/secrets}/
findworks.process-role=${FINDWORKS_PROCESS_ROLE:local}
findworks.deployment.environment=${FINDWORKS_ENVIRONMENT:local}
findworks.deployment.database-id=${FINDWORKS_DATABASE_ID:local}
findworks.deployment.provider-account-id=${FINDWORKS_PROVIDER_ACCOUNT_ID:local}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/findworks}
spring.datasource.username=${DATABASE_USERNAME:findworks}
spring.datasource.password=${DATABASE_PASSWORD:findworks}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.flyway.validate-migration-naming=true
spring.threads.virtual.enabled=true

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
info.app.name=FindWorks
logging.structured.format.console=${STRUCTURED_LOG_FORMAT:ecs}

server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.task.scheduling.pool.size=4
server.error.include-message=never
server.error.include-stacktrace=never

findworks.pilot.organisation-id=${PILOT_ORGANISATION_ID:10000000-0000-0000-0000-000000000001}
findworks.pilot.investigator-email=${INVESTIGATOR_EMAIL:investigator@findworks.local}
findworks.pilot.investigator-password=${INVESTIGATOR_PASSWORD:findworks}
findworks.pi.executable=${PI_EXECUTABLE:pi}
findworks.pi.provider=${PI_PROVIDER:openai-codex}
findworks.pi.model=${PI_MODEL:gpt-5.6-luna}
findworks.pi.session-directory=${PI_SESSION_DIRECTORY:${java.io.tmpdir}/findworks-pi-sessions}
findworks.pi.timeout=${PI_TIMEOUT:PT90S}

# Interview Pi turns are disabled until a digest-pinned image and a tested rootless OCI/egress boundary are supplied.
findworks.runtime.enabled=${INTERVIEW_RUNTIME_ENABLED:false}
findworks.runtime.executable=${OCI_EXECUTABLE:podman}
findworks.runtime.image=${PI_RUNTIME_IMAGE:}
findworks.runtime.network=${PI_RUNTIME_NETWORK:none}
findworks.runtime.egress-proxy=${PI_RUNTIME_EGRESS_PROXY:}
findworks.runtime.user=${PI_RUNTIME_USER:10001:10001}
findworks.runtime.memory=${PI_RUNTIME_MEMORY:512m}
findworks.runtime.cpus=${PI_RUNTIME_CPUS:1.0}
findworks.runtime.pids-limit=${PI_RUNTIME_PIDS:64}
findworks.runtime.nofile-limit=${PI_RUNTIME_NOFILE:256}
findworks.runtime.tmpfs-size=${PI_RUNTIME_TMPFS:32m}
findworks.runtime.timeout=${PI_RUNTIME_TIMEOUT:PT90S}
findworks.runtime.provider=${PI_PROVIDER:openai-codex}
findworks.runtime.model=${PI_MODEL:gpt-5.6-luna}
findworks.runtime.provider-credential=${MODEL_PROVIDER_CREDENTIAL:}
findworks.runtime.checkpoint-key-id=${RUNTIME_CHECKPOINT_KEY_ID:}
findworks.runtime.checkpoint-key=${RUNTIME_CHECKPOINT_KEY:}
findworks.invitation.public-origin=${PUBLIC_ORIGIN:}
findworks.invitation.sender=${INVITATION_SENDER:}
findworks.invitation.active-key-id=${INVITATION_TOKEN_KEY_ID:}
findworks.invitation.active-secret=${INVITATION_TOKEN_SECRET:}
findworks.invitation.previous-key-id=${INVITATION_PREVIOUS_TOKEN_KEY_ID:}
findworks.invitation.previous-secret=${INVITATION_PREVIOUS_TOKEN_SECRET:}
findworks.interview.contact=${INTERVIEW_CONTACT:}
findworks.retention.worker-cron=${RETENTION_WORKER_CRON:0 0 * * * *}
findworks.worker.heartbeat-interval=${WORKER_HEARTBEAT_INTERVAL:PT30S}
findworks.operations.trust-proxy-correlation=${TRUST_PROXY_CORRELATION:false}
findworks.operations.old-job-threshold=${OLD_JOB_THRESHOLD:PT5M}
findworks.operations.minimum-disk-free-ratio=${MINIMUM_DISK_FREE_RATIO:0.10}
findworks.operations.operator-id=${SUPPORT_OPERATOR_ID:}
findworks.operations.break-glass-key-id=${BREAK_GLASS_KEY_ID:}
findworks.operations.break-glass-key=${BREAK_GLASS_KEY:}
findworks.operations.monitor-cron=${OPERATIONS_MONITOR_CRON:0 * * * * *}
findworks.recovery.require-verified-gate=${RECOVERY_GATE_REQUIRED:false}
findworks.recovery.backup-required=${BACKUP_REQUIRED:false}
findworks.recovery.maximum-drill-age=${MAXIMUM_RECOVERY_DRILL_AGE:P90D}
findworks.recovery.operator-id=${RECOVERY_OPERATOR_ID:}
findworks.recovery.bundle-key-id=${RECOVERY_BUNDLE_KEY_ID:}
findworks.recovery.bundle-key=${RECOVERY_BUNDLE_KEY:}
findworks.recovery.application-image-digest=${RECOVERY_APPLICATION_IMAGE:}
