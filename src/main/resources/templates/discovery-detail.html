<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${discovery.title()} + ' · FindWorks'">Discovery · FindWorks</title><link rel="stylesheet" th:href="@{/assets/app.css}"></head>
<body class="app-body"><div class="app-frame">
    <th:block th:replace="~{fragments/app-shell :: sidebar('discoveries', ${investigator})}"></th:block>
    <main class="app-main">
        <nav class="breadcrumbs" aria-label="Breadcrumb"><a th:href="@{/app/discoveries}">Discoveries</a><span aria-hidden="true">/</span><span th:text="${discovery.title()}">Current Discovery</span></nav>
        <header class="workspace-header detail-header"><div><h1 th:text="${discovery.title()}">Discovery</h1><p th:text="${discovery.objective()}">Objective</p></div></header>
        <section class="workspace-section" aria-labelledby="discovery-missions-heading">
            <div class="section-heading"><div><h2 id="discovery-missions-heading">Interview Missions</h2><p>The deliberate knowledge-seeking work inside this Discovery.</p></div></div>
            <div class="empty-state compact-empty" th:if="${#lists.isEmpty(missions)}"><h3>No Missions yet</h3><p>Submit a draft Mission from your project-aware harness.</p></div>
            <div class="discovery-list" th:unless="${#lists.isEmpty(missions)}">
                <a class="discovery-row" th:each="mission : ${missions}" th:href="${mission.href()}">
                    <span><strong th:text="${mission.label()}">Mission</strong><span><span class="status-label" th:classappend="' status-' + ${mission.statusTone()}" th:text="${mission.status()}">Status</span><span th:text="' · Version ' + ${mission.version()}"> · Version 1</span></span></span>
                    <span class="discovery-meta" th:text="${mission.action()}">Continue</span>
                </a>
            </div>
        </section>

    </main>
</div></body>
</html>
