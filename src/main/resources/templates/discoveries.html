<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discoveries | FindWorks</title><link rel="stylesheet" th:href="@{/styles.css}" href="/styles.css">
</head>
<body>
<header class="shell header">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">F</span><span>FindWorks</span></a>
    <form method="post" th:action="@{/logout}"><button class="text-button" type="submit">Sign out</button></form>
</header>
<main class="shell narrow page">
    <p class="eyebrow">Your work</p>
    <h1 class="page-title">Discoveries</h1>
    <p class="lede">Resume an investigation or start learning something new.</p>
    <a class="button" href="/discoveries/new">Create a Discovery</a>
    <section class="discovery-list" aria-label="Discoveries">
        <p class="empty-state" th:if="${#lists.isEmpty(discoveries)}">No Discoveries yet.</p>
        <a th:each="discovery : ${discoveries}" th:href="@{/discoveries/{id}(id=${discovery.id})}">
            <strong th:text="${discovery.title}">Discovery title</strong>
            <span th:text="${discovery.objective}">Objective</span>
        </a>
    </section>
</main>
</body>
</html>
