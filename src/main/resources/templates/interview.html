<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${interview.title + ' | FindWorks'}">Interview | FindWorks</title><link rel="stylesheet" href="/styles.css">
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.2/bundles/datastar.js"></script>
</head>
<body class="interview-body">
<header class="shell header"><a class="brand" href="/"><span class="brand-mark">F</span><span>FindWorks</span></a><span class="pilot-label">Private interview</span></header>
<main class="shell interview-shell">
    <section id="interview-card" class="interview-card" th:fragment="interview-card">
        <div th:if="${interview.status == 'completed'}" class="completion">
            <span class="completion-mark">✓</span><p class="eyebrow">Interview complete</p>
            <h1>Thank you, <span th:text="${interview.intervieweeName}">there</span>.</h1>
            <p>Your answers have been saved. The investigator can now review what you shared.</p>
        </div>
        <div th:unless="${interview.status == 'completed'}">
            <div class="progress-row"><span th:text="${'Question ' + (interview.position + 1) + ' of ' + interview.total}">Question 1 of 3</span><progress th:value="${interview.position}" th:max="${interview.total}"></progress></div>
            <p class="eyebrow" th:text="${interview.title}">Mission</p><h1 class="question" th:text="${interview.question}">Question</h1>
            <form method="post" th:action="@{/interview/answers}" data-on:submit="@post('/interview/answers', {contentType: 'form'})">
                <input type="hidden" name="itemId" th:value="${interview.itemId}"><label class="sr-only" for="answer">Your answer</label>
                <textarea id="answer" name="answer" maxlength="10000" required rows="8" autofocus placeholder="Answer in your own words. You do not need to use technical language."></textarea>
                <button class="button" type="submit">Save and continue</button>
            </form>
            <p class="interview-help">It is fine to say you do not know, or name somebody better placed to answer.</p>
        </div>
    </section>
</main>
</body>
</html>
