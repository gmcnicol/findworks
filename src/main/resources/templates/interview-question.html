<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Interview · FindWorks</title><link rel="stylesheet" th:href="@{/assets/app.css}"></head>
<body><main class="shell centered"><section class="participant-panel"><p class="subtle">Current area · first required area</p><aside class="accepted-answer" th:if="${answer != null}"><strong>Answer accepted</strong><p th:text="${answer}">Your accepted answer</p></aside><details class="accepted-answer" th:if="${!answers.isEmpty()}"><summary>Review or revise accepted answers</summary><article th:each="prior : ${answers}"><p th:text="${prior.optionLabel() != null ? prior.optionLabel() : prior.exactText()}">Your accepted answer</p><p th:if="${prior.explanation() != null}" th:text="${prior.explanation()}">Explanation</p><form class="form" method="post" th:action="@{/interview/revise}"><input type="hidden" name="evidenceId" th:value="${prior.id()}"><label>Revise this answer<textarea name="answer" rows="3" required maxlength="10000"></textarea></label><button class="button secondary">Save revision</button></form></article></details><div th:if="${working}" role="status"><h1>Preparing your next question</h1><p class="subtle">Your answer is safe. This usually takes a moment.</p></div><div th:unless="${working}"><h1 th:text="${question}">Question</h1><form th:if="${questionMode != 'FREE_TEXT'}" class="form" method="post" th:action="@{/interview/structured-answer}"><fieldset><legend>Quick response</legend><label th:each="option : ${options}"><input type="radio" name="optionId" th:value="${option.id}" required><span th:text="${option.label}">Choice</span></label></fieldset><label>Anything to add? <textarea name="explanation" rows="3" maxlength="10000"></textarea></label><button class="button" type="submit">Submit response</button></form><form class="form" method="post" th:action="@{/interview/answer}"><label>Your answer in your own words<textarea name="answer" rows="7" required maxlength="10000"></textarea></label><button class="button" type="submit">Submit answer</button></form><nav class="participant-routes" aria-label="Other response options"><form method="post" th:action="@{/interview/do-not-know}"><button type="submit">I don’t know</button></form><form method="post" th:action="@{/interview/another-owner}"><label>Owner<input name="owner" required maxlength="120"></label><label>What they own<input name="reason" required maxlength="2000"></label><button type="submit">Someone else owns this</button></form><form method="post" th:action="@{/interview/clarify}"><button type="submit">Please clarify</button></form><form method="post" th:action="@{/interview/discomfort}"><button type="submit">This feels uncomfortable</button></form><form method="post" th:action="@{/interview/pause}"><button type="submit">Pause and leave</button></form><form method="post" th:action="@{/interview/end-early}"><button type="submit">End here</button></form></nav></div></section></main></body>
</html>
