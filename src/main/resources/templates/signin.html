<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · FindWorks</title>
    <link rel="stylesheet" th:href="@{/assets/app.css}">
</head>
<body>
<main class="shell centered">
    <form class="panel form focus-panel" method="post" th:action="@{/signin}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <p class="eyebrow">Pilot Investigator sign in</p>
        <h1>Sign in to FindWorks</h1>
        <p>Only verified pilot Investigator memberships can continue.</p>
        <label>
            <span>Email</span>
            <input type="email" name="username" autocomplete="username" required>
        </label>
        <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="button" type="submit">Continue</button>
    </form>
</main>
</body>
</html>
