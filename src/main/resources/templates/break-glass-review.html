<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review protected support access</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body><main>
  <h1>Review protected support access</h1>
  <p>Support requests temporary access to one Evidence item. Approval expires automatically.</p>
  <dl>
    <dt>Reason category</dt><dd th:text="${request.reasonCode}"></dd>
    <dt>Reason</dt><dd th:text="${request.reason}"></dd>
    <dt>Status</dt><dd th:text="${request.status}"></dd>
    <dt>Expires</dt><dd th:text="${request.expiresAt}"></dd>
  </dl>
  <form th:if="${request.status == 'pending'}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button name="decision" value="approve">Approve temporary access</button>
    <button name="decision" value="reject">Reject</button>
  </form>
</main></body>
</html>
