<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Interview complete · FindWorks</title><link rel="stylesheet" th:href="@{/assets/app.css}"><th:block th:replace="~{fragments/clerk :: scripts}"></th:block></head>
<body class="participant-body interview-complete-body">
<main class="interview-shell" id="interview-shell" th:fragment="interviewShell">
    <th:block th:replace="~{fragments/interview :: masthead}"></th:block>
    <th:block th:replace="~{fragments/interview :: progress}"></th:block>
    <th:block th:replace="~{fragments/interview :: transcript}"></th:block>
    <section class="conversation-state is-complete" aria-labelledby="complete-title">
        <h1 id="complete-title">Thank you</h1>
        <p th:if="${view.state() == 'COMPLETED'}">Your interview is complete. Your accepted answers remain available to the Investigator as durable Evidence.</p>
        <p th:if="${view.state() == 'ENDED_EARLY'}">The Investigator can see what you shared and which areas remain open.</p>
        <p class="state-support">You can review the complete conversation above.</p>
    </section>
</main>
</body>
</html>
