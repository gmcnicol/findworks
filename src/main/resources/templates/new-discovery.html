<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New discovery | FindWorks</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="shell header"><a class="brand" href="/"><span class="brand-mark">F</span><span>FindWorks</span></a><form method="post" th:action="@{/logout}"><button class="text-button" type="submit">Sign out</button></form></header>
<main class="shell narrow page">
    <p class="eyebrow">New Discovery</p>
    <h1 class="page-title">What do you need to learn?</h1>
    <p class="lede">Start with the objective. FindWorks will help shape the Interview Mission next.</p>
    <form class="form-card" method="post" th:action="@{/discoveries}">
        <label>Discovery title<input name="title" maxlength="200" required placeholder="Understand the returns process"></label>
        <label>What do you need to learn?<textarea name="objective" maxlength="5000" required rows="6" placeholder="Learn how returns really work, including exceptions and unclear ownership."></textarea></label>
        <button class="button" type="submit">Create Discovery</button>
    </form>
</main>
</body>
</html>
