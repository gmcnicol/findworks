<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirm completion · FindWorks</title><link rel="stylesheet" th:href="@{/assets/app.css}"><th:block th:replace="~{fragments/clerk :: scripts}"></th:block></head>
<body class="participant-body">
<main class="shell centered" id="interview-shell" th:fragment="interviewShell">
    <th:block th:replace="~{fragments/clerk :: participantAccount}"></th:block>
    <section class="panel state-panel">
        <p class="eyebrow">One last check</p>
        <h1>Ready to finish?</h1>
        <p>We recorded your answers. These points remain open:</p>
        <ul><li th:each="item : ${unresolved}" th:text="${item}">Unresolved point</li></ul>
        <p class="subtle">You can confirm this is an honest stopping point. It does not pretend the open points are resolved.</p>
        <form method="post" th:action="@{${interviewBase + '/confirm-completion'}}"><button class="button" type="submit">Confirm and finish</button></form>
    </section>
</main>
</body>
</html>
