<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="app-sidebar" th:fragment="sidebar(active, investigator)">
    <a class="app-wordmark" th:href="@{/app}" aria-label="FindWorks dashboard">
        <span class="app-wordmark-mark" aria-hidden="true">F</span>
        <span class="app-wordmark-name">FindWorks</span>
        <span class="app-wordmark-context">Research operations</span>
    </a>

    <nav class="app-navigation" aria-label="Workspace">
        <a th:if="${clerkEnabled}" th:href="@{/work}">Your saved work &amp; interviews</a>
        <a th:href="@{/app}" th:classappend="${active == 'dashboard'} ? ' is-active'" th:attr="aria-current=${active == 'dashboard'} ? 'page' : null">Dashboard</a>
        <a th:href="@{/app/discoveries}" th:classappend="${active == 'discoveries'} ? ' is-active'" th:attr="aria-current=${active == 'discoveries'} ? 'page' : null">Discoveries</a>
        <a th:href="@{/app/missions}" th:classappend="${active == 'missions'} ? ' is-active'" th:attr="aria-current=${active == 'missions'} ? 'page' : null">Missions</a>
        <a th:href="@{/app/findings}" th:classappend="${active == 'findings'} ? ' is-active'" th:attr="aria-current=${active == 'findings'} ? 'page' : null">Findings</a>
        <a th:href="@{/oauth/grants}" th:classappend="${active == 'harnesses'} ? ' is-active'" th:attr="aria-current=${active == 'harnesses'} ? 'page' : null">Harness access</a>
    </nav>

    <div class="app-account">
        <span class="app-account-name" th:text="${investigator.displayName()}">Gareth</span>
        <span th:text="${investigator.organizationName()}">FindWorks Pilot</span>
        <button th:if="${clerkEnabled}" class="text-button" type="button" data-clerk-sign-out>Sign out</button>
        <form th:unless="${clerkEnabled}" method="post" th:action="@{/signout}">
            <button class="text-button" type="submit">Sign out</button>
        </form>
    </div>
    <p hidden role="alert" data-clerk-sign-out-error>Sign-out failed. Check your connection and try again.</p>
    <th:block th:replace="~{fragments/clerk :: scripts}"></th:block>
</aside>
</body>
</html>
