<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="scripts" th:if="${clerkEnabled}">
    <script th:if="${clerkAuthComponent != null}" defer crossorigin="anonymous" th:src="${clerkUiScriptUrl}"></script>
    <script defer crossorigin="anonymous" th:attr="data-clerk-publishable-key=${clerkPublishableKey}"
            th:src="${clerkScriptUrl}"></script>
    <script type="module" th:src="@{/assets/clerk-auth.js}"></script>
</th:block>
<nav th:fragment="participantAccount" th:if="${clerkEnabled}" class="participant-routes" aria-label="Your account">
    <a th:href="@{/work}">Your saved work</a>
    <button type="button" data-clerk-sign-out>Sign out</button>
    <p hidden role="alert" data-clerk-sign-out-error>Sign-out failed. Check your connection and try again.</p>
</nav>
</body>
</html>
