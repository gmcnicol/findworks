<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finding source | FindWorks</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="shell header"><a class="brand" href="/"><span class="brand-mark">F</span><span>FindWorks</span></a><span class="pilot-label">Evidence</span></header>
<main class="shell narrow page">
    <a th:href="@{/missions/{missionId}/findings/{versionId}(missionId=${missionId},versionId=${versionId})}">Back to findings</a>
    <p class="eyebrow">Source context</p><h1 class="page-title">Surrounding answer</h1>
    <p th:text="${source.question}">Question</p>
    <blockquote th:text="${source.answer}">Full immutable answer</blockquote>
    <p><strong>Exact quotation:</strong> <span th:text="${source.quotation}">Quotation</span></p>
    <p th:text="${source.sourceName + ' · ' + source.sourceType}">Source</p>
</main>
</body>
</html>
