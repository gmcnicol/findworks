<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${discovery.title + ' | FindWorks'}">Discovery | FindWorks</title>
    <link rel="stylesheet" th:href="@{/styles.css}" href="/styles.css">
</head>
<body>
<header class="shell header">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">F</span><span>FindWorks</span></a>
    <form method="post" th:action="@{/logout}"><button class="text-button" type="submit">Sign out</button></form>
</header>
<main class="shell narrow page">
    <p class="eyebrow">Discovery</p>
    <h1 class="page-title" th:text="${discovery.title}">Discovery title</h1>
    <p class="lede" th:text="${discovery.objective}">Objective</p>
    <section class="action-card">
        <p class="eyebrow">Next</p>
        <h2>Shape this Discovery</h2>
        <p>FindWorks will grill you to clarify what must be learned and from whom.</p>
    </section>
    <a class="text-link" href="/discoveries">Back to Discoveries</a>
</main>
</body>
</html>
