<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FindWorks</title>
    <link rel="stylesheet" th:href="@{/assets/app.css}">
</head>
<body>
<main class="shell centered">
    <section class="panel focus-panel">
        <p class="eyebrow">FindWorks · Research operations</p>
        <h1>Find what you need to know from other people.</h1>
        <p th:if="${signedOut}" class="notice">You are signed out.</p>
        <p>Sign in with your verified pilot account to review and run Discoveries.</p>
        <a class="button" th:href="@{/signin}">Sign in</a>
    </section>
</main>
</body>
</html>
